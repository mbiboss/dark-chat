<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>DARK CHAT</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Welcome Screen -->
    <div id="welcome-screen" class="screen active">
        <div class="terminal-container">
            <div class="terminal-header">
                <span class="terminal-cursor">></span> DARK CHAT
            </div>
            <div class="terminal-body">
                <div class="glitch-text">DARK CHAT</div>
                <div class="terminal-line">SECURE COMMUNICATION CHANNEL</div>
                <div class="input-container">
                    <span class="prompt">ENTER YOUR NAME:</span>
                    <input type="text" id="username-input" maxlength="20" autocomplete="off">
                    <button id="enter-chat-btn">ENTER CHAT</button>
                </div>
            </div>
            <div class="terminal-footer">
                ONLY WAY TO CONTACT WITH DARK
            </div>
        </div>
    </div>

    <!-- Chat Screen -->
    <div id="chat-screen" class="screen">
        <div class="chat-header">
            <span class="terminal-cursor">></span> DARK CHAT
            <span class="connection-status">● SECURE</span>
        </div>
        <div id="messages-container" class="messages-container">
            <!-- Messages will appear here -->
        </div>
        <div id="typing-indicator" class="typing-indicator"></div>
        <div class="message-input-container">
            <input type="text" id="message-input" placeholder="Type message..." maxlength="500">
            <button id="send-btn">SEND</button>
        </div>
    </div>

    <!-- Call Interface -->
    <div id="call-screen" class="screen">
        <div class="call-container">
            <div class="call-status">
                <div class="call-title">DARK // SECURE CHANNEL</div>
                <div id="call-state-display" class="call-state">CONNECTING...</div>
                <div id="audio-waveform" class="audio-waveform">
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                </div>
                <video id="remote-video" autoplay playsinline></video>
                <div id="call-error" class="call-error"></div>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
